# EDIT Backend gpu-backend: gpuIsolationGroups += tenant2
apiVersion: aifabrics.eda.nokia.com/v1
kind: Backend
metadata:
  name: gpu-backend
  namespace: neocloud
spec:
  type:
    overlay: EVPN
  asnPool: asn-pool
  systemPoolIPv4: systemipv4-pool
  ipMTU: 4200
  addressAllocation:
    type: EDAManagedIPv6
    edaManagedIPv6:
      leafIndexPoolScope: Global
      prefixLength: '64'
  stripes:
  - name: gpu-backend-leaves
    stripeID: 1
    gpuVLAN: 1
    nodeSelectors:
    - fabric=backend,role=leaf
  stripeConnector:
    name: gpu-backend-spine
    nodeSelectors:
    - fabric=backend,role=spine
    linkSelectors:
    - role=interSwitch,fabric=backend
  gpuIsolationGroups:
  - name: tenant1
    interfaceSelectors:
    - role=gpu,backend=tenant1
  - name: tenant2
    interfaceSelectors:
    - role=gpu,backend=tenant2
  rocev2QoS:
    ecnSlopeMinThresholdPercent: 5
    ecnSlopeMaxThresholdPercent: 80
    ecnMaxDropProbabilityPercent: 100
    pfcDeadlockDetectionTimerMs: 750
    pfcDeadlockRecoveryTimerMs: 750
    queueMaximumBurstSizeBytes: 1024000
---
# EDIT Policy leak-shared-import: statements += tenant2 (shared-services reaches tenant2)
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata:
  name: leak-shared-import
  namespace: neocloud
spec:
  defaultAction:
    policyResult: Reject
  statements:
  - name: tenant1
    match:
      prefixSet: tenant1-subnet
    action:
      policyResult: Accept
  - name: tenant2
    match:
      prefixSet: tenant2-subnet
    action:
      policyResult: Accept
---
