# neocloud — EDGE: border routers (ASBR) + VRF internet on the DC1 border leaves. High-level CRs only where EDA allows it
# (owner rule 2026-11-10): ONE VirtualNetwork `internet` with two Routers, edge + internet.
# REDESIGN 2026-11-12 (owner): tenants never peer BGP with the border routers. The full internet table stays on the
# BRs; VRF internet on the DC1 border leaves holds only a 0/0 GENERATED by the BRs and leaks it into tenant1 (route
# leaking = manifests/leaking.yaml); tenant1's subnet leaks back into VRF internet and is announced to the BRs.
# Was until 2026-11-12: per-tenant eBGP sessions BL <-> BR on VLAN 11/12, tenant public /28s, BL loopbacks 203.0.113.11/.12.
#
#   internet (FRR, AS 64510; hosts.sh) — announces 198.51.100.0/24 + 192.0.2.0/24 (the "full table"; no default)
#        | eth1.10 / eth2.10
#   border-router-1/2 (X1B, AS 64500, OUT of every Fabric): Router `edge` = type Simple (a plain VRF, no EVPN) with
#        all their routed sub-interfaces, BGP groups and peers (iBGP BR1<->BR2 next-hop-self).
#        Low-level, 2 per BR: DefaultRouter + SystemInterface. WHY: a Router refuses to deploy on a node without a
#        SystemInterface ("missing dependency of type SystemInterfaceState", dry-run txn 858), and only a Fabric or a
#        hand-written pair creates one. They carry no BGP and no interfaces.
#        | eBGP, VLAN 10 on every BR <-> border-leaf link:
#        |   BR -> BL: ONLY a generated 0/0 (BGPGroup sendDefaultRoute; owner Q2 B: the BRs originate it themselves)
#        |   BL -> BR: ONLY 100.100.100.0/24 (tenant1, owner Q3 A: no host routes outside the DC) + 203.0.113.128/26 (fw-1)
#   border-leaf-1/2 + svc-leaf-1/2 Router `internet` (AS 64501): EVPNVXLAN since 2026-11-16 (fw-1's public subnet sits on
#        the service leaves; was type Simple on the border leaves only, 2026-11-12 Q1 A), bgp.ebgpPreference 160 (WHY:
#        leaking.yaml header, no ping-pong), routeLeaking 0/0 out / tenant1 in.
#   BR -> internet: ONLY 100.100.100.0/24 + 203.0.113.128/26. tenant2 (200.200.200.0/24) never leaves the DC (no internet
#        service, Q4).
#
# p2p /31s (100.64.0.0/24 = shared address space, outside CX mgmt 192.168.1.0/24 + Talos pod/svc ranges):
#   BR1 e1-1 .0 <-> BL1 e1-3 .1   BR1 e1-2 .2 <-> BL2 e1-3 .3   BR2 e1-1 .4 <-> BL1 e1-4 .5
#   BR2 e1-2 .6 <-> BL2 e1-4 .7   BR1 e1-3 .8 <-> BR2 e1-3 .9
#   BR1 e1-4 .10 <-> internet eth1.10 .11   BR2 e1-4 .12 <-> internet eth2.10 .13
#   BR system0 100.64.255.1 / .2 (default network-instance, router-id of VRF edge)
# Explicit policies everywhere (SR Linux eBGP default = reject without one). Apply AFTER leaking.yaml.
apiVersion: routingpolicies.eda.nokia.com/v1
kind: PrefixSet
metadata: { name: internet-public, namespace: neocloud }
spec:
  prefixes:
    - { prefix: 100.100.100.0/24, startRange: 24, endRange: 24 }   # tenant1
    - { prefix: 203.0.113.128/26, startRange: 26, endRange: 26 }   # fw-1 public subnet in VRF internet (2026-11-16)
---
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata: { name: internet-public-only, namespace: neocloud }
spec:
  defaultAction: { policyResult: Reject }
  statements: [ { name: tenant1, match: { prefixSet: internet-public }, action: { policyResult: Accept } } ]
---
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata: { name: default-route-only, namespace: neocloud }
spec:
  defaultAction: { policyResult: Reject }
  statements: [ { name: default, match: { prefixSet: default-route }, action: { policyResult: Accept } } ]
---
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata: { name: accept-all, namespace: neocloud }
spec:
  defaultAction: { policyResult: Accept }
---
# ---------- upgrade DRAIN of a border router (2026-11-17): the same routes as internet-public-only / default-route-only,
# AS path prepended 3x. Set per BGP peer (exportPolicies override on br<N>-internet / br<N>-border-leaf-<M>) by the upgrade
# pipeline's drain-edge job for every border router of the batch, removed by undrain-edge after its post-checks.
# WHY: EDA's Drain covers DefaultRouters only; the BRs route in VRF edge (since 2026-11-10) ⇒ a rebooting BR was never
# drained: on its way back its sessions flapped, the internet router (graceful-restart helper) kept the flapped
# session's routes as stale and sent the return traffic to a BR without routes ⇒ 22-29 s loss per run (measured
# 2026-11-16/17, single-BR probe 26.1 s). Prepended ⇒ the internet router and the border leaves prefer the other BR for
# the whole maintenance, stale copies included.
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata: { name: internet-public-drain, namespace: neocloud }
spec:
  defaultAction: { policyResult: Reject }
  statements:
    - { name: drained, match: { prefixSet: internet-public }, action: { policyResult: Accept, bgp: { asPathPrepend: { asn: Auto, count: 3 } } } }
---
apiVersion: routingpolicies.eda.nokia.com/v1
kind: Policy
metadata: { name: default-route-drain, namespace: neocloud }
spec:
  defaultAction: { policyResult: Reject }
  statements:
    - { name: drained, match: { prefixSet: default-route }, action: { policyResult: Accept, bgp: { asPathPrepend: { asn: Auto, count: 3 } } } }
---
# ---------- border routers: the minimum the default network-instance needs (see header) ----------
apiVersion: routing.eda.nokia.com/v1
kind: DefaultRouter
metadata: { name: router-border-router-1, namespace: neocloud }
spec: { node: border-router-1, routerID: 100.64.255.1, description: "ASBR 1: system interface only (routing = VRF edge)", bgp: { enabled: false } }
---
apiVersion: routing.eda.nokia.com/v1
kind: DefaultRouter
metadata: { name: router-border-router-2, namespace: neocloud }
spec: { node: border-router-2, routerID: 100.64.255.2, description: "ASBR 2: system interface only (routing = VRF edge)", bgp: { enabled: false } }
---
apiVersion: routing.eda.nokia.com/v1
kind: SystemInterface
metadata: { name: border-router-1-system0, namespace: neocloud }
spec: { defaultRouter: router-border-router-1, ipv4Address: 100.64.255.1/32 }
---
apiVersion: routing.eda.nokia.com/v1
kind: SystemInterface
metadata: { name: border-router-2-system0, namespace: neocloud }
spec: { defaultRouter: router-border-router-2, ipv4Address: 100.64.255.2/32 }
---
# ---------- VirtualNetwork internet: VRF edge on both BRs + VRF internet on the DC1 border leaves ----------
apiVersion: services.eda.nokia.com/v2
kind: VirtualNetwork
metadata: { name: internet, namespace: neocloud }
spec:
  routers:
    - name: edge
      spec:
        type: Simple
        description: ASBR routing instance (CSP AS 64500) on border-router-1/2, full internet table
        nodeSelectors: [ "role=border-router" ]
        bgp: { enabled: true, autonomousSystem: 64500, ipv4Unicast: { enabled: true } }
    # owner 2026-11-16 Q2 A "firewall should be part of the internet network": fw-1 (svc-leaf-1/2) gets a public subnet
    # in this VRF ⇒ the VRF spans the border leaves AND the service leaves ⇒ EVPNVXLAN (was Simple, border leaves only,
    # 2026-11-12 Q1 A). NO nodeSelectors: a Router without them deploys exactly where its interfaces are (CRD doc) =
    # border leaves (routedInterfaces to the BRs) + svc-leaf-1/2 (IRB of fw-1's subnet); the svc-leaves share
    # role=leaf,fabric=frontend with leaf-3..8, so a selector could not pick them alone.
    - name: internet
      spec:
        type: EVPNVXLAN
        description: DC1 internet VRF (border leaves + service leaves); 0/0 from the BRs, leaked into tenant1; fw-1 public subnet
        routeLeaking: { exportPolicy: leak-internet-export, importPolicy: leak-internet-import }
        bgp: { enabled: true, autonomousSystem: 64501, ebgpPreference: 160, ipv4Unicast: { enabled: true } }
  # fw-1 public subnet (owner 2026-11-16 Q2 A): 203.0.113.128/26, anycast gateway .129, fw-1 .130, VLAN 120 on the LAG
  # labelled frontend=internet (fw-1 on svc-leaf-1/2). In PrefixSet internet-public ⇒ the border leaves announce it to the
  # BRs and the BRs to the internet. tenant1 reaches it through its leaked 0/0 (public to public); tenant2 and
  # shared-services do not.
  bridgeDomains:
    - { name: internet-fw-bd, spec: { type: EVPNVXLAN, description: "fw-1 public subnet 203.0.113.128/26 (VRF internet)" } }
  irbInterfaces:
    - name: internet-fw-irb
      spec:
        router: internet
        bridgeDomain: internet-fw-bd
        ipAddresses: [ { ipv4Address: { ipPrefix: 203.0.113.129/26, primary: true, anycast: true } } ]
        ipv4: { learnUnsolicitedARP: Enabled }
        evpnRouteAdvertisementType: { arpDynamic: true, ndDynamic: true }
        hostRoutePopulate: { dynamic: { populate: true, datapathProgramming: true } }
  vlans:
    - { name: internet-fw-vlan120, spec: { bridgeDomain: internet-fw-bd, vlanID: "120", interfaceSelectors: [ "frontend=internet" ] } }
  routedInterfaces:
    # --- Router edge (border routers), VLAN 10: to VRF internet on the DC1 border leaves, BR1 <-> BR2, to the internet host
    - { name: br1-to-border-leaf-1, spec: { router: edge, interface: border-router-1-ethernet-1-1, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.0/31, primary: true } ] } }
    - { name: br1-to-border-leaf-2, spec: { router: edge, interface: border-router-1-ethernet-1-2, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.2/31, primary: true } ] } }
    - { name: br2-to-border-leaf-1, spec: { router: edge, interface: border-router-2-ethernet-1-1, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.4/31, primary: true } ] } }
    - { name: br2-to-border-leaf-2, spec: { router: edge, interface: border-router-2-ethernet-1-2, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.6/31, primary: true } ] } }
    - { name: br1-to-br2, spec: { router: edge, interface: border-router-1-ethernet-1-3, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.8/31, primary: true } ] } }
    - { name: br2-to-br1, spec: { router: edge, interface: border-router-2-ethernet-1-3, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.9/31, primary: true } ] } }
    - { name: br1-to-internet, spec: { router: edge, interface: border-router-1-ethernet-1-4, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.10/31, primary: true } ] } }
    - { name: br2-to-internet, spec: { router: edge, interface: border-router-2-ethernet-1-4, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.12/31, primary: true } ] } }
    # --- Router internet (DC1 border leaves), VLAN 10 to both BRs
    - { name: bl1-to-br1, spec: { router: internet, interface: border-leaf-1-ethernet-1-3, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.1/31, primary: true } ] } }
    - { name: bl2-to-br1, spec: { router: internet, interface: border-leaf-2-ethernet-1-3, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.3/31, primary: true } ] } }
    - { name: bl1-to-br2, spec: { router: internet, interface: border-leaf-1-ethernet-1-4, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.5/31, primary: true } ] } }
    - { name: bl2-to-br2, spec: { router: internet, interface: border-leaf-2-ethernet-1-4, vlanID: "10", ipv4Addresses: [ { ipPrefix: 100.64.0.7/31, primary: true } ] } }
  protocols:
    bgp:
      bgpGroups:
        - name: br-to-dc
          spec:
            description: "eBGP BR -> DC1 border leaves (VRF internet, AS 64501): generated 0/0 only"
            peerAS: { autonomousSystem: 64501 }
            ipv4Unicast: { enabled: true }
            sendDefaultRoute: { addressFamilies: [ IPv4Unicast ] }
            importPolicies: [ internet-public-only ]
            exportPolicies: [ default-route-only ]   # nothing of the full table; the generated 0/0 only
        - name: br-to-internet
          spec:
            description: eBGP BR -> internet (AS 64510)
            peerAS: { autonomousSystem: 64510 }
            ipv4Unicast: { enabled: true }
            importPolicies: [ accept-all ]
            exportPolicies: [ internet-public-only ]
        - name: br-ibgp
          spec:
            description: iBGP BR1 <-> BR2 (AS 64500)
            peerAS: { autonomousSystem: 64500 }
            nextHopSelf: true
            ipv4Unicast: { enabled: true }
            importPolicies: [ accept-all ]
            exportPolicies: [ accept-all ]
        - name: internet-to-br
          spec:
            description: eBGP VRF internet -> border routers (AS 64500)
            peerAS: { autonomousSystem: 64500 }
            ipv4Unicast: { enabled: true }
            importPolicies: [ default-route-only ]
            exportPolicies: [ internet-public-only ]
      bgpPeers:
        - { name: br1-border-leaf-1, spec: { group: br-to-dc, interface: br1-to-border-leaf-1, interfaceKind: RoutedInterface, peerIP: 100.64.0.1 } }
        - { name: br1-border-leaf-2, spec: { group: br-to-dc, interface: br1-to-border-leaf-2, interfaceKind: RoutedInterface, peerIP: 100.64.0.3 } }
        - { name: br2-border-leaf-1, spec: { group: br-to-dc, interface: br2-to-border-leaf-1, interfaceKind: RoutedInterface, peerIP: 100.64.0.5 } }
        - { name: br2-border-leaf-2, spec: { group: br-to-dc, interface: br2-to-border-leaf-2, interfaceKind: RoutedInterface, peerIP: 100.64.0.7 } }
        - { name: br1-br2, spec: { group: br-ibgp, interface: br1-to-br2, interfaceKind: RoutedInterface, peerIP: 100.64.0.9 } }
        - { name: br2-br1, spec: { group: br-ibgp, interface: br2-to-br1, interfaceKind: RoutedInterface, peerIP: 100.64.0.8 } }
        - { name: br1-internet, spec: { group: br-to-internet, interface: br1-to-internet, interfaceKind: RoutedInterface, peerIP: 100.64.0.11 } }
        - { name: br2-internet, spec: { group: br-to-internet, interface: br2-to-internet, interfaceKind: RoutedInterface, peerIP: 100.64.0.13 } }
        - { name: bl1-br1, spec: { group: internet-to-br, interface: bl1-to-br1, interfaceKind: RoutedInterface, peerIP: 100.64.0.0 } }
        - { name: bl2-br1, spec: { group: internet-to-br, interface: bl2-to-br1, interfaceKind: RoutedInterface, peerIP: 100.64.0.2 } }
        - { name: bl1-br2, spec: { group: internet-to-br, interface: bl1-to-br2, interfaceKind: RoutedInterface, peerIP: 100.64.0.4 } }
        - { name: bl2-br2, spec: { group: internet-to-br, interface: bl2-to-br2, interfaceKind: RoutedInterface, peerIP: 100.64.0.6 } }
