# neocloud telemetry: Prometheus + Grafana in k8s ns neocloud (the EDA namespace's own k8s ns;
# it goes away with destroy.sh). Copy of the aifabric stack (owner 2026-11-02: "i only want the
# topology svg ... similar to what we have for aifabric").
# No PVCs: Prometheus keeps 2 days in an emptyDir; Grafana is fully provisioned from
# ConfigMaps (neocloud-prometheus-config, neocloud-grafana-provisioning, neocloud-grafana-dashboards),
# created by `deploy.sh grafana`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: neocloud
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      securityContext: { fsGroup: 65534, runAsUser: 65534, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.4.2
          imagePullPolicy: IfNotPresent
          securityContext:   # PodSecurity "restricted" (else a warning on every apply)
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports: [{ containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: 9090 }, periodSeconds: 5 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: neocloud-prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: neocloud
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: neocloud
  labels: { app: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext: { fsGroup: 472, runAsUser: 472, runAsGroup: 472, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: grafana/grafana:12.0.2
          imagePullPolicy: IfNotPresent
          securityContext:   # PodSecurity "restricted" (else a warning on every apply)
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3000 }]
          # Ready = serving (after the plugin download), so `rollout status` in deploy.sh means usable
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 5, failureThreshold: 3 }
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_USERS_DEFAULT_THEME, value: light }
            # last path element must equal the HttpProxy name (httpproxy.yaml)
            - { name: GF_SERVER_ROOT_URL, value: "__EDA_URL__/core/httpproxy/v1/neocloud-grafana/" }   # filled in by deploy.sh (EDA URL)
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/neocloud-topology.json }
            # topology panel plugin, downloaded from grafana.com at every start (needs internet);
            # pinned = the version the microseg Grafana runs
            - { name: GF_INSTALL_PLUGINS, value: "andrewbmchugh-flow-panel 1.18.5" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            # EDA 26.8 HttpProxy injects "default-src 'self'" when the upstream sends no CSP,
            # which blocks Grafana's inline boot scripts ("Page not found"). It passes an
            # upstream CSP through, so Grafana sends its own (nonce-based). telemetry-stack §17.7
            - { name: GF_SECURITY_CONTENT_SECURITY_POLICY, value: "true" }
            - name: GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE
              value: "script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self' data:;style-src 'self' 'unsafe-inline' blob:;img-src * data: blob:;base-uri 'self';connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';worker-src 'self' blob:;form-action 'self';frame-ancestors 'self';"
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml }
            # whole-directory mount (no subPath) => dashboard updates arrive without a restart
            - { name: dashboards, mountPath: /etc/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: provisioning, configMap: { name: neocloud-grafana-provisioning } }
        - { name: dashboards, configMap: { name: neocloud-grafana-dashboards } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: neocloud
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
